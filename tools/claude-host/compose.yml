# Claude Code host for the La Simona fork. Create it in OMV's web UI (Services > Compose > Files > Add), named
# claude-code, with this file as its contents; OMV keeps it in compose/appdata/claude-code/. "Up" builds the image
# from the fork's Dockerfile on GitHub (no git or checkout needed on the NAS). The start scripts run from the fork
# cloned into ./home, so they update with a git pull there; only a Dockerfile change needs the stack's Build, then Up.
# Set GM_HOST=<display address> in the stack's environment file (OMV: the stack's Environment field). The container
# reaches the machine with the NAS's own address, so the firewall rule that lets the logger through covers it too.
# No Docker socket: the container can't touch the NAS's other stacks.
services:
  claude-code:
    build:
      context: https://raw.githubusercontent.com/brisneylander/gaggimate/la-simona/tools/claude-host/Dockerfile
    image: gaggimate-claude:latest
    container_name: claude-code
    hostname: claude-code
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      GM_HOST: ${GM_HOST:?set GM_HOST in the stack's environment file to the GaggiMate display's address}
      GM_LOGS: /logs
      TZ: Australia/Brisbane
    volumes:
      - ./home:/home/claude # sign-ins, Claude Code itself, PlatformIO toolchains, the repo
      - ../gaggimate-logger/logs:/logs:ro # the logger's daily CSVs and valve-timing.csv
    mem_limit: 6g
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
