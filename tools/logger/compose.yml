# GaggiMate telemetry logger (logger.mjs). On the NAS: compose/appdata/gaggimate-logger/, started with
# `docker compose up -d`; daily CSV files land in ./logs. The display's address comes from the stack's environment
# file (GM_HOST=<address>); if the machine is on an isolated network, the NAS needs a firewall rule to reach it on
# TCP 80.
services:
  gaggimate-logger:
    image: node:22-alpine
    container_name: gaggimate-logger
    restart: unless-stopped
    user: "1003:100" # claude:users, owner of ./logs
    working_dir: /app
    command: ["node", "/app/logger.mjs"]
    environment:
      GM_HOST: ${GM_HOST:?set GM_HOST in the stack's environment file to the GaggiMate display's address}
      LOG_DIR: /logs
      TZ: Australia/Brisbane
    volumes:
      - ./logger.mjs:/app/logger.mjs:ro
      - ./logs:/logs
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"
