# Fork-only: publishes site/ (the fork's front page) to GitHub Pages at https://brisneylander.github.io/gaggimate/.
# Needs Settings > Pages > Source set to "GitHub Actions" once.
on:
  push:
    branches:
      - master
    paths:
      - "site/**"
      - ".github/workflows/fork-pages.yml"
  workflow_dispatch:

name: Fork Pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fork-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
