syntax = "proto3";

// Namespaced so the generated C types (gaggimate_Frame, gaggimate_Error, ...)
// never collide with app-side structs of the same short name.
package gaggimate;

// GaggiMate controller <-> display protocol.
//
// The transport (BLE today, UART tomorrow) delivers whole datagrams; each
// datagram is exactly one nanopb-encoded `Frame`. A Frame bundles one or more
// `Payload`s -- the "container" that lets us drive several components in the
// same atomic update -- together with the id/ack bookkeeping the Endpoint uses
// for reliable, de-duplicated delivery.

// ---------------------------------------------------------------------------
// Framing
// ---------------------------------------------------------------------------

message Frame {
    // Monotonic per-sender sequence id. id == 0 marks a frame that needs no
    // acknowledgement (a pure ACK). Data frames always use id >= 1.
    uint32 id = 1;
    // When non-zero, acknowledges receipt of the peer's frame with this id.
    // A pure ACK carries id == 0, ack != 0 and an empty payloads list.
    uint32 ack = 2;
    // One or more messages delivered together (see Frame.payloads in the
    // .options file for the cap).
    repeated Payload payloads = 3;
}

// Tagged union of every protocol message. The oneof tag drives dispatch on the
// receiving Endpoint -- there is no run-time type erasure.
message Payload {
    reserved 5; // retired AltControl (merged into RelayControl: relay index 1)
    reserved 6; // retired PidSettings (merged into HeaterSettings)
    oneof content {
        // Commands: display -> controller
        MachineHardwareSettings machine_hardware = 17;
        Ping ping = 1;
        BoilerControl boiler = 2;
        PumpControl pump = 3;
        RelayControl relay = 4;
        PumpSettings pump_model = 7;
        AutotuneRequest autotune = 8;
        PressureScale pressure_scale = 9;
        Tare tare = 10;
        HardwareScaleTare hardware_scale_tare = 31;
        LedControl led = 11;
        ScaleFactors scale_factors = 12;
        HeaterSettings heater = 13;

        // Responses: controller -> display
        MachineHardwareStatus machine_hardware_status = 30;
        SystemInfo system_info = 20;
        SensorData sensor = 21;
        ButtonState button = 22;
        AutotuneResult autotune_result = 23;
        VolumetricMeasurement volumetric = 24;
        TofMeasurement tof = 25;
        Error error = 26;
        ScaleMeasurement scale = 27;
    }
}

// ---------------------------------------------------------------------------
// Commands (display -> controller)
// ---------------------------------------------------------------------------

message Ping {}

enum BoilerMode {
    BOILER_MODE_TEMPERATURE = 0; // `setpoint` is a target temperature in degC
    BOILER_MODE_PRESSURE = 1;    // `setpoint` is a target pressure in bar
}

// Boiler control. index selects the boiler (0, 1, ...) the same way
// ButtonState.index selects a button today. `mode` chooses how `setpoint` is
// interpreted (temperature today; pressure reserved for pressure-regulated
// steam boilers).
message BoilerControl {
    uint32 index = 1;
    BoilerMode mode = 2;
    float setpoint = 3; // degC or bar per `mode`, 0 = off
    bool hold = 4;      // heater off for now, the setpoint and control state kept (flush to target)
}

enum PumpMode {
    PUMP_MODE_POWER = 0;    // run at `power` percent
    PUMP_MODE_PRESSURE = 1; // target `pressure`, `flow` is the limit
    PUMP_MODE_FLOW = 2;     // target `flow`, `pressure` is the limit
}

message PumpControl {
    uint32 index = 1; // pump 0, 1, ...
    PumpMode mode = 2;
    float power = 3;    // 0..100 %, used in POWER mode
    float pressure = 4; // bar
    float flow = 5;     // ml/s
}

// Binary on/off output (solenoid valve or relay). index selects the output:
// 0 = brew solenoid valve, 1 = configurable "alt" relay (further indices
// reserved for additional valves/relays).
message RelayControl {
    uint32 index = 1;
    bool open = 2;
}

// Complete heater configuration; the controller keeps its heaters off until it has received one.
message HeaterSettings {
    float kp = 1;
    float ki = 2;
    float kd = 3;
    float kf = 4;                         // combined thermal feedforward gain
    bool heater_coordination_enabled = 5; // dual boiler: power heaters one at a time instead of in parallel, brew first
    uint32 handover_ms = 6;               // dual boiler: dead time between heaters when coordinated (clamped 20..5000)
    float steam_kp = 7;
    float steam_ki = 8;
    float steam_kd = 9;
    // La Simona lag compensation (brew boiler), numbered after upstream's fields. 0 = off, so a display that never
    // sends these keeps the legacy loop.
    float derivative_filter_s = 30; // low-pass time constant on the D term (s)
    float integral_zone = 31;       // integrate only while |error| < this (degC); also pauses I during water flow
    float sensor_dead_time_s = 32;  // heater-to-sensor dead time (s): length of the post-flow I pause, predictor delay
    float model_heater_w = 33;      // heat-balance predictor: heater power (W)
    float model_heat_rate = 34;     // heat-balance predictor: full-power heat-up rate (degC/s)
    float model_loss_w = 35;        // heat-balance predictor: saved standing loss to start from (W), 0 = default guess
    float inlet_temp_c = 36;        // tank water temperature (degC) for the predictor and thermal feedforward, 0 = 23
    float water_dead_time_s = 37;   // heat-balance predictor: delay from water flowing to the sensor (s), 0 = dead time
    float valve_dump_ml = 38;       // water the valve dumps when a flush or shot ends (ml), 0 = none
    float safety_no_rise_brew_s = 39;  // heater safety: full power, no rise, at brew setpoints (s), 0 = 60
    float safety_no_rise_steam_s = 40; // heater safety: the same at steam setpoints (s), 0 = 300
    float group_heat_capacity = 41;    // group head estimate: heat capacity (J/degC), 0 = off (GroupHeadEstimate.h)
    float group_coupling = 42;         // group head estimate: water to group head coupling (W/degC)
}

message MachineHardwareSettings {
    float ntc_brew_nominal_resistance = 1;
    float ntc_brew_series_resistance = 2;
    float ntc_brew_supply_voltage = 3;
    float ntc_brew_beta = 4;
    float ntc_steam_nominal_resistance = 5;
    float ntc_steam_series_resistance = 6;
    float ntc_steam_supply_voltage = 7;
    float ntc_steam_beta = 8;
    bool tank_level_enabled = 9;
    bool steam_level_enabled = 10;
    reserved 11;
    reserved 12;
    reserved 13, 14;
    uint32 steam_level_debounce_checks = 15;
    uint32 version = 16;
    reserved 17, 18;
    bool restart_if_required = 19;
    reserved 20;
    reserved 21;
    reserved 22;
}

message MachineHardwareStatus {
    uint32 hash = 1;
    bool ready = 2;
    bool error = 3;
}

message PumpSettings {
    // c and d may be NaN to signal two-point flow-measurement mode
    // (a = oneBarFlow, b = nineBarFlow) instead of polynomial coefficients.
    float a = 1;
    float b = 2;
    float c = 3;
    float d = 4;

    float commutationGain = 5;
    float convergenceGain = 6;
    float integralGain = 7;

    // BLDC pumps only
    float maxBLDCPower = 8;

    // Rotary-vane slip polynomial coefficients (gear pump only; 0 = no slip).
    float slipA = 9;
    float slipB = 10;
    float slipC = 11;
    float slipD = 12;
}

message AutotuneRequest {
    uint32 test_time = 1;      // seconds
    uint32 samples = 2;
    uint32 heater_wattage = 3; // 0 = unknown, controller skips combinedKff derivation
}

message PressureScale {
    float scale = 1;
}

// Reset pump-derived volume counters only.
message Tare {}

message HardwareScaleTare {}

message ScaleFactors {
    float scale_factor1 = 1;
    float scale_factor2 = 2;
    uint32 sample_rate_sps = 3;
    float idle_filter_alpha = 4;
    float active_filter_alpha = 5;
}

// One LED output's target brightness.
message LedChannel {
    uint32 channel = 1;    // PCA9634 output index (0..7)
    uint32 brightness = 2; // 0..255
    uint32 effect = 3; // Onboard channels: 0 off, 1 flashing, 2 breathing, 3 on; Alba ignores this.
    uint32 min_brightness = 4; // onboard animation floor (0..brightness)
    uint32 cycle_time_ms = 5;  // onboard full animation cycle (500..10000 ms)
}

// Drive one or more LED channels in a single atomic update. Carrying every
// changed channel in one message (instead of one message per channel) keeps the
// outbound coalescing queue from collapsing a burst of per-channel updates into
// a single surviving channel.
message LedControl {
    repeated LedChannel channels = 1;
}

// ---------------------------------------------------------------------------
// Responses (controller -> display)
// ---------------------------------------------------------------------------

message Capabilities {
    bool dimming = 1;
    bool pressure = 2;
    bool led_control = 3;
    bool tof = 4;
    repeated Addon addons = 5;
    bool dual_boiler = 6;
}

message Addon {
    uint32 type = 1;
}

message SystemInfo {
    string hardware = 1;
    string version = 2;
    Capabilities capabilities = 3;
    uint32 protocol_version = 4; // bumped on any breaking schema change; lets the display detect a mismatch
}

// Per-boiler temperature + pressure reading. index selects the boiler (0, 1,
// ...) so the controller can report several boilers.
message BoilerReading {
    uint32 index = 1;
    float temperature = 2;
    float pressure = 3;
    float power = 4; // heater power 0..100 %
    float standing_loss_w = 5; // learned standing loss (W) at 93 °C in a 23 °C room (learned per °C), 0 = predictor off
}

message SensorData {
    reserved 6;

    repeated BoilerReading boilers = 1;
    float puck_flow = 2;
    float pump_flow = 3;
    float puck_resistance = 4;
    float pump_power = 5;   // pump power 0..100 %
    float water_pumped = 7; // cumulative water pumped in ml
    bool has_tank_level = 8;
    bool tank_level_ok = 9;
    reserved 10 to 16;
    optional bool steam_boiler_low = 17; // Present once the enabled level sensor has a debounced reading.
    bool valve_open = 30;                // La Simona: the brew valve's relay as the controller has it
}

message ButtonState {
    uint32 index = 1;
    bool pressed = 2;
}

message AutotuneResult {
    float kp = 1;
    float ki = 2;
    float kd = 3;
    float kf = 4;
    // What the step response identified, for the lag-compensation settings; 0 = not measured (older controllers).
    float heat_rate = 5;   // k': steady rise at full power (degC/s)
    float dead_time_s = 6; // step to first reaction (s)
    float heater_w = 7;    // the wattage the run was started with
}

message VolumetricMeasurement {
    float volume = 1;
}

// Hardware-scale weight, sent on its own channel (distinct from the pump-derived
// VolumetricMeasurement estimate) so the display can offer both as independently
// selectable volumetric sources.
message ScaleMeasurement {
    float weight = 1;
    float cell1_weight = 2;
    float cell2_weight = 3;
    bool cell1_valid = 4;
    bool cell2_valid = 5;
}

message TofMeasurement {
    uint32 distance = 1;
}

enum ErrorCode {
    ERROR_CODE_NONE = 0;
    ERROR_CODE_COMM_SEND = 1;
    ERROR_CODE_COMM_RCV = 2;
    ERROR_CODE_PROTO_ERR = 3;
    ERROR_CODE_RUNAWAY = 4;
    ERROR_CODE_TIMEOUT = 5;
    ERROR_CODE_AUTOTUNE_TIMEOUT = 6;
    ERROR_CODE_HEATER_NO_RISE = 7;        // heater safety layer: near full power, temperature not rising
    ERROR_CODE_SENSOR_JUMPS = 8;          // heater safety layer: temperature reading jumping
    ERROR_CODE_FULL_POWER_TOO_LONG = 9;   // heater safety layer: continuous full power too long
    ERROR_CODE_OVER_TEMP = 10;            // heater safety layer: reading above the safe limit
    ERROR_CODE_SENSOR_FAULT = 11;         // heater safety layer: temperature sensor failing
}

message Error {
    ErrorCode code = 1;
}
